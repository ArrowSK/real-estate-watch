x-app-environment: &app-environment
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://realestate:${POSTGRES_PASSWORD:-change-me}@db:5432/realestate
  APP_DEFAULT_LANGUAGE: ${APP_DEFAULT_LANGUAGE:-en}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Budapest}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
  SOURCE_STALE_HOURS: ${SOURCE_STALE_HOURS:-36}
  SELF_HEAL_ENABLED: ${SELF_HEAL_ENABLED:-true}
  MARKET_NOTIFY_CHANGE_PERCENT: ${MARKET_NOTIFY_CHANGE_PERCENT:-1.0}
  NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
  ADMIN_KEY: ${ADMIN_KEY:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - realestate-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["scheduler"]

volumes:
  realestate-db:
