name: One-time v0.2 nowcast label fix

on:
  push:
    paths:
      - '.github/workflows/one-time-v02-label-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fast-forward to current main
        run: git pull --ff-only origin main
      - name: Patch renamed nowcast fields and copy
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'app/main.py',
              '                "trend_factor": comparison.official.trend_factor,',
              '                "city_reference_huf_m2": comparison.official.city_reference_huf_m2,\n'
              '                "local_factor": comparison.official.local_factor,',
          )

          replace_once(
              'app/i18n.py',
              '        "trend_factor": "Subsequent Budapest movement",',
              '        "city_reference": "Same-year Budapest all-dwelling reference",\n'
              '        "local_factor": "Local / property-type factor",',
          )
          replace_once(
              'app/i18n.py',
              '        "trend_factor": "Azóta mért budapesti mozgás",',
              '        "city_reference": "Azonos évi budapesti összlakás-referencia",\n'
              '        "local_factor": "Helyi / ingatlantípus szorzó",',
          )
          replace_once(
              'app/i18n.py',
              '        "estimate_intro": "Start with the finest verified KSH transaction benchmark available, move it forward with the official Budapest transaction trend, then apply only the property adjustments you select.",',
              '        "estimate_intro": "For second-hand Budapest homes, start with the latest official Budapest transaction benchmark and apply the finest verified local/property-type KSH factor available; then apply only the property adjustments you select.",',
          )
          replace_once(
              'app/i18n.py',
              '        "estimate_intro": "A lehető legrészletesebb ellenőrzött KSH tranzakciós referenciából indulunk, ezt a hivatalos budapesti tranzakciós trenddel hozzuk jelen időre, majd csak az Ön által kiválasztott ingatlanjellemzőket korrigáljuk.",',
              '        "estimate_intro": "Budapesti használt lakásnál a legfrissebb hivatalos budapesti tranzakciós referencia az alap, amelyre a lehető legrészletesebb ellenőrzött KSH helyi és ingatlantípus-szorzót alkalmazzuk; ezután csak az Ön által kiválasztott ingatlanjellemzőket korrigáljuk.",',
          )
          PY
      - name: Commit and push
        run: |
          git config user.name 'Real Estate Watch maintenance'
          git config user.email '56678503+ArrowSK@users.noreply.github.com'
          git add app/main.py app/i18n.py
          git diff --cached --check
          git commit -m 'Align v0.2 UI and API with the local-factor nowcast'
          git push origin main
