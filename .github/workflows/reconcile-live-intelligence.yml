name: Reconcile live market intelligence

on:
  push:
    branches:
      - reconcile/live-market-intelligence
    paths:
      - '.github/workflows/reconcile-live-intelligence.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fast-forward reconciliation branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Apply reviewed reconciliation patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          def append_once(path: str, marker: str, addition: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              file.write_text(text.rstrip() + '\n\n' + addition.strip() + '\n')

          # Duna House: retain main's reviewed provider boundary, while carrying over the
          # feature branch's useful disappearance tolerance and structured factual fields.
          replace_once(
              'app/services/duna_house.py',
              'from app.models import (\n    AskingMarketSnapshot,\n    ListingSnapshot,\n    ObservedListing,\n    ProviderPolicyState,\n)',
              'from app.models import (\n    AskingMarketSnapshot,\n    ListingSnapshot,\n    ObservedListing,\n    ObservedListingAttribute,\n    ObservedListingPresence,\n    ProviderPolicyState,\n)',
          )
          replace_once(
              'app/services/duna_house.py',
              '    property_type: str\n    market_segment: str\n\n    @property',
              '    property_type: str\n    market_segment: str\n    status_label: str | None = None\n    building_type: str | None = None\n    condition: str | None = None\n    construction_year: int | None = None\n    floor: str | None = None\n    lift: str | None = None\n    balcony: str | None = None\n    view: str | None = None\n    orientation: str | None = None\n    heating: str | None = None\n    energy_rating: str | None = None\n\n    @property',
          )
          replace_once(
              'app/services/duna_house.py',
              '    soup = BeautifulSoup(html, "html.parser")\n    visible = re.sub(r"\\s+", " ", soup.get_text(" ", strip=True))',
              '    soup = BeautifulSoup(html, "html.parser")\n    labelled_visible = re.sub(r"\\s+", " ", soup.get_text(" | ", strip=True))\n    visible = re.sub(r"\\s+", " ", soup.get_text(" ", strip=True))',
          )
          replace_once(
              'app/services/duna_house.py',
              '\ndef _area_from_postcode(postcode: str | None, locality: str | None) -> str:',
              '''\ndef _label_value(text: str, labels: tuple[str, ...]) -> str | None:\n    for label in labels:\n        match = re.search(rf"{re.escape(label)}\\s*:?\\s*([^|]{{1,120}})", text, re.IGNORECASE)\n        if match:\n            value = re.sub(r"\\s+", " ", match.group(1)).strip(" :-")\n            if value:\n                return value[:120]\n    return None\n\n\ndef _area_from_postcode(postcode: str | None, locality: str | None) -> str:''',
          )
          replace_once(
              'app/services/duna_house.py',
              '    if "újépítésű" in visible.casefold() or (external_id or "").startswith("PR"):\n        market_segment = "new"\n\n    if not external_id:',
              '''    if "újépítésű" in visible.casefold() or (external_id or "").startswith("PR"):\n        market_segment = "new"\n\n    building_type = _label_value(labelled_visible, ("Épület szerkezete", "Építés módja", "Szerkezet"))\n    condition = _label_value(labelled_visible, ("Ingatlan állapota", "Állapot"))\n    year_text = _label_value(labelled_visible, ("Építés éve", "Építési év"))\n    construction_year = (\n        int(year_text)\n        if year_text and re.fullmatch(r"(?:18|19|20)\\d{2}", year_text.strip())\n        else None\n    )\n    status_label = (\n        "price_drop"\n        if "áresés" in visible.casefold() or "árcsökkent" in visible.casefold()\n        else None\n    )\n\n    if not external_id:''',
          )
          replace_once(
              'app/services/duna_house.py',
              '        property_type=property_type,\n        market_segment=market_segment,\n    )',
              '''        property_type=property_type,\n        market_segment=market_segment,\n        status_label=status_label,\n        building_type=building_type,\n        condition=condition,\n        construction_year=construction_year,\n        floor=_label_value(labelled_visible, ("Emelet",)),\n        lift=_label_value(labelled_visible, ("Lift",)),\n        balcony=_label_value(labelled_visible, ("Erkély", "Terasz")),\n        view=_label_value(labelled_visible, ("Kilátás",)),\n        orientation=_label_value(labelled_visible, ("Tájolás",)),\n        heating=_label_value(labelled_visible, ("Fűtés",)),\n        energy_rating=_label_value(labelled_visible, ("Energetikai besorolás", "Energetika")),\n    )''',
          )
          replace_once(
              'app/services/duna_house.py',
              '\ndef _percentile(values: list[float], fraction: float) -> float:',
              '''\ndef _presence_row(db: Session, listing_id: int) -> ObservedListingPresence:\n    row = db.get(ObservedListingPresence, listing_id)\n    if row is None:\n        row = ObservedListingPresence(listing_id=listing_id)\n        db.add(row)\n        db.flush()\n    return row\n\n\ndef update_presence_from_sitemap(\n    db: Session,\n    existing: list[ObservedListing],\n    discovered_urls: set[str],\n    *,\n    now: datetime | None = None,\n) -> dict[str, int]:\n    settings = get_settings()\n    now = now or _utcnow()\n    marked_inactive = 0\n    pending_missing = 0\n    recovered = 0\n    for item in existing:\n        presence = _presence_row(db, item.id)\n        if canonical_url(item.listing_url) in discovered_urls:\n            recovered += int(not item.active or presence.sitemap_miss_count > 0)\n            item.active = True\n            presence.sitemap_miss_count = 0\n            presence.missing_since_at = None\n            presence.inactive_at = None\n            presence.last_sitemap_seen_at = now\n            continue\n        presence.sitemap_miss_count += 1\n        presence.missing_since_at = presence.missing_since_at or now\n        if presence.sitemap_miss_count >= max(1, settings.dh_inactive_after_misses):\n            if item.active:\n                marked_inactive += 1\n            item.active = False\n            presence.inactive_at = presence.inactive_at or now\n        else:\n            pending_missing += 1\n    db.commit()\n    return {\n        "marked_inactive": marked_inactive,\n        "pending_missing": pending_missing,\n        "recovered": recovered,\n    }\n\n\ndef _upsert_listing_attributes(\n    db: Session,\n    item: ObservedListing,\n    facts: ListingFacts,\n    now: datetime,\n) -> None:\n    row = db.get(ObservedListingAttribute, item.id)\n    if row is None:\n        row = ObservedListingAttribute(listing_id=item.id)\n        db.add(row)\n    for field in (\n        "status_label",\n        "building_type",\n        "condition",\n        "construction_year",\n        "floor",\n        "lift",\n        "balcony",\n        "view",\n        "orientation",\n        "heating",\n        "energy_rating",\n    ):\n        setattr(row, field, getattr(facts, field))\n    row.updated_at = now\n\n\ndef _percentile(values: list[float], fraction: float) -> float:''',
          )
          replace_once(
              'app/services/duna_house.py',
              '        areas = {item.area_code}\n        if item.area_code.startswith("BUDAPEST_"):\n            areas.add("BUDAPEST")',
              '        areas = {item.area_code}\n        if item.area_code.startswith("BUDAPEST_"):\n            areas.add("BUDAPEST")\n        if item.postcode:\n            areas.add(f"POSTCODE_{item.postcode}")',
          )
          replace_once(
              'app/services/duna_house.py',
              '''        removed = 0\n        for item in existing:\n            if item.active and canonical_url(item.listing_url) not in discovered_urls:\n                item.active = False\n                removed += 1\n        db.commit()''',
              '''        presence_summary = update_presence_from_sitemap(db, existing, discovered_urls)\n        removed = presence_summary["marked_inactive"]''',
          )
          replace_once(
              'app/services/duna_house.py',
              '''                item.active = True\n                item.quality_state = "usable"\n\n            snapshot = db.scalar(''',
              '''                item.active = True\n                item.quality_state = "usable"\n\n            presence = _presence_row(db, item.id)\n            presence.sitemap_miss_count = 0\n            presence.missing_since_at = None\n            presence.inactive_at = None\n            presence.last_sitemap_seen_at = now\n            _upsert_listing_attributes(db, item, facts, now)\n\n            snapshot = db.scalar(''',
          )
          replace_once(
              'app/services/duna_house.py',
              '            "removed": removed,\n            "aggregates": aggregates,',
              '            "removed": removed,\n            "pending_missing": presence_summary["pending_missing"],\n            "recovered": presence_summary["recovered"],\n            "aggregates": aggregates,',
          )

          # Web routes: port the feature branch's useful Live and Local workspaces onto main's
          # corrected analytics and data model instead of reviving the obsolete nowcast.
          replace_once(
              'app/main.py',
              'from app.services.analytics import ASKING_PROPERTY_MAP, market_comparison, transaction_nowcast',
              'from app.services.analytics import (\n    ASKING_PROPERTY_MAP,\n    LOCAL_PROPERTY_MAP,\n    market_comparison,\n    transaction_nowcast,\n)',
          )
          replace_once(
              'app/main.py',
              'from app.services.duna_house import asking_market_series',
              'from app.services.duna_house import DH_SOURCE_KEY, asking_market_series',
          )
          replace_once(
              'app/main.py',
              'from app.services.ksh_local import streets_for_area\nfrom app.services.market import ensure_seed_market_data, market_series',
              '''from app.services.ksh_local import streets_for_area\nfrom app.services.live_intelligence import (\n    live_comparison,\n    live_history,\n    live_signals,\n    local_district_signal,\n    local_street_signals,\n    local_years,\n)\nfrom app.services.market import ensure_seed_market_data, market_series''',
          )
          live_routes = r'''

@app.get("/live", response_class=HTMLResponse)
def live_market_page(
    request: Request,
    area: str = Query("BUDAPEST"),
    postcode: str = Query(""),
    market: str = Query("second_hand"),
    property_type: str = Query("all"),
    db: Session = Depends(get_db),
):
    language = language_from_request(request)
    provider = HungaryProvider()
    all_areas = provider.areas()
    areas = [item for item in all_areas if item["code"] in {"HU", "BUDAPEST"} or item["code"].startswith("BUDAPEST_")]
    valid_areas = {item["code"] for item in areas}
    selected_area = area if area in valid_areas else "BUDAPEST"
    selected_market = market if market in {"second_hand", "new"} else "second_hand"
    selected_property_type = property_type if property_type in {"all", "apartment", "house"} else "all"

    district_signals = live_signals(
        db,
        area_code=selected_area,
        property_type=selected_property_type,
        market_segment=selected_market,
    )
    valid_postcodes = {value for value, _ in district_signals.postcodes}
    selected_postcode = postcode if postcode in valid_postcodes else ""
    scope_area = f"POSTCODE_{selected_postcode}" if selected_postcode else selected_area
    signals = (
        live_signals(
            db,
            area_code=scope_area,
            property_type=selected_property_type,
            market_segment=selected_market,
        )
        if selected_postcode
        else district_signals
    )
    comparison = live_comparison(
        db,
        area_code=scope_area,
        property_type=selected_property_type,
        market_segment=selected_market,
    )
    history = live_history(
        db,
        area_code=scope_area,
        property_type=selected_property_type,
        market_segment=selected_market,
    )
    policy = db.scalar(
        select(ProviderPolicyState).where(ProviderPolicyState.source_key == DH_SOURCE_KEY)
    )
    area_info = _area_info(areas, selected_area)
    area_name = area_info["name_hu"] if language == "hu" else area_info["name_en"]
    scope_label = f"{selected_postcode} · {area_name}" if selected_postcode else area_name
    return templates.TemplateResponse(
        request,
        "live.html",
        template_context(
            request,
            language,
            areas=areas,
            selected_area=selected_area,
            selected_postcode=selected_postcode,
            postcode_options=district_signals.postcodes,
            selected_market=selected_market,
            selected_property_type=selected_property_type,
            property_types=PROPERTY_TYPES,
            signals=signals,
            comparison=comparison,
            history=history,
            scope_label=scope_label,
            policy_ok=bool(policy and policy.status == "experimental_allowed"),
        ),
    )


@app.get("/local", response_class=HTMLResponse)
def local_market_page(
    request: Request,
    area: str = Query("BUDAPEST_06"),
    property_type: str = Query("apartment"),
    year: int | None = Query(None),
    q: str = Query(""),
    db: Session = Depends(get_db),
):
    language = language_from_request(request)
    provider = HungaryProvider()
    districts = [item for item in provider.areas() if item["code"].startswith("BUDAPEST_")]
    valid_areas = {item["code"] for item in districts}
    selected_area = area if area in valid_areas else "BUDAPEST_06"
    selected_property_type = property_type if property_type in {"all", "apartment", "house", "panel"} else "apartment"
    source_type = LOCAL_PROPERTY_MAP[selected_property_type]
    years = local_years(db, selected_area)
    selected_year = year if year in years else (years[0] if years else 0)
    search = q.strip()[:80]
    district_signal = (
        local_district_signal(
            db,
            area_code=selected_area,
            property_type=source_type,
            year=selected_year,
        )
        if selected_year
        else None
    )
    street_rows = (
        local_street_signals(
            db,
            area_code=selected_area,
            property_type=source_type,
            year=selected_year,
            search=search,
        )
        if selected_year
        else []
    )
    return templates.TemplateResponse(
        request,
        "local.html",
        template_context(
            request,
            language,
            districts=districts,
            selected_area=selected_area,
            property_types=PROPERTY_TYPES,
            selected_property_type=selected_property_type,
            years=years,
            selected_year=selected_year,
            search=search,
            district_signal=district_signal,
            street_rows=street_rows,
        ),
    )
'''
          replace_once(
              'app/main.py',
              '\n\n@app.get("/valuation", response_class=HTMLResponse)',
              live_routes + '\n\n@app.get("/valuation", response_class=HTMLResponse)',
          )

          # Navigation: retain the current visual language and add the two reconciled workspaces.
          replace_once(
              'app/templates/base.html',
              '''      <a href="/valuation" class="{% if request.url.path == '/valuation' %}active{% endif %}">\n        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#valuation"></use></svg>\n        <span>{{ t.valuation }}</span>\n      </a>''',
              '''      <a href="/live" class="{% if request.url.path == '/live' %}active{% endif %}">\n        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#asking"></use></svg>\n        <span>{{ t.live_market }}</span>\n      </a>\n      <a href="/local" class="{% if request.url.path == '/local' %}active{% endif %}">\n        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#location"></use></svg>\n        <span>{{ t.local_market }}</span>\n      </a>\n      <a href="/valuation" class="{% if request.url.path == '/valuation' %}active{% endif %}">\n        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#valuation"></use></svg>\n        <span>{{ t.valuation }}</span>\n      </a>''',
          )

          # Bilingual copy for the reconciled views.
          en_anchor = '        "diagnostics": "Diagnostics",\n'
          en_insert = '''        "live_market": "Live asking",\n        "local_market": "Local evidence",\n'''
          replace_once('app/i18n.py', en_anchor, en_anchor + en_insert)
          hu_anchor = '        "diagnostics": "Diagnosztika",\n'
          hu_insert = '''        "live_market": "Élő kínálat",\n        "local_market": "Helyi adatok",\n'''
          replace_once('app/i18n.py', hu_anchor, hu_anchor + hu_insert)

          en_tail = '''        "asking_market_not_ready": "Observed asking data has not yet reached the minimum publishable sample for this selection.",\n'''
          en_more = '''        "observed_subset": "Observed source subset",\n        "live_title": "What sellers are asking now",\n        "live_intro": "A dedicated view of the factual Duna House listings observed by this deployment. It shows source-subset behaviour, not a claim about every active Hungarian listing.",\n        "experimental": "EXPERIMENTAL",\n        "policy_ok": "Policy guard passed",\n        "policy_paused": "Provider paused",\n        "postcode": "Postcode",\n        "all_postcodes": "All observed postcodes",\n        "median_asking": "Median asking price",\n        "price_cuts": "Observed price cuts",\n        "observed_reductions": "Observed reductions",\n        "median_cut": "median cut",\n        "new_observations": "New observations",\n        "last_7_days": "last 7 days",\n        "today": "today",\n        "observed_days": "Median observed days",\n        "observed_days_note": "Time since this deployment first saw the listing; it is not the portal's original publication age.",\n        "observed_history": "Observed asking history",\n        "transaction_comparison": "Transaction comparison",\n        "asking_gap_note": "The asking/transaction gap compares different populations and is not an expected negotiation discount.",\n        "feature_coverage": "Structured factual coverage",\n        "listings_with_features": "Listings with ≥1 structured feature",\n        "feature_field_coverage": "Feature-field completeness",\n        "usable_live_rows": "Usable active observations",\n        "feature_privacy_note": "Only short factual attributes are retained: no descriptions, photos or contact details.",\n        "source_policy": "Source policy boundary",\n        "removed_not_sold": "Removed ≠ sold",\n        "removed_not_sold_note": "A listing is marked inactive only after repeated sitemap absence. The app never converts disappearance into a completed sale.",\n        "completed_transactions": "completed transaction evidence",\n        "local_title": "Street-level evidence without false precision",\n        "local_intro": "Inspect KSH annual district and street observations, then express their same-year local factor against the latest Budapest second-hand transaction benchmark.",\n        "district": "District",\n        "street_search": "Street filter",\n        "street_search_placeholder": "e.g. Andrássy",\n        "official_local": "Published local mean",\n        "local_factor_note": "Published local mean divided by the same-year Budapest all-dwelling mean; applied to the latest Budapest second-hand benchmark.",\n        "current_local_estimate": "Current local-factor estimate",\n        "street_detail": "Street evidence ledger",\n        "street": "Street",\n        "no_street_rows": "No published street observations match this selection.",\n        "local_method_note": "Street rows are KSH aggregates. Current values are transparent factor-based nowcasts, not observed current sale prices.",\n        "local_source_note": "KSH Ingatlanadattár contains annual aggregate completed-transaction statistics derived from transaction records; missing cells stay missing.",\n        "precision": "Precision discipline",\n        "local_precision_note": "Low-count or dispersed street samples are labelled with lower confidence rather than being presented with equal authority.",\n'''
          replace_once('app/i18n.py', en_tail, en_tail + en_more)

          hu_tail = '''        "asking_market_not_ready": "A megfigyelt kínálati adatok még nem érték el az ehhez a választáshoz szükséges minimális közölhető mintát.",\n'''
          hu_more = '''        "observed_subset": "Megfigyelt forrásminta",\n        "live_title": "Mennyit kérnek most az eladók",\n        "live_intro": "Az adott telepítés által megfigyelt Duna House-hirdetések tényszerű adatait mutatja. Ez a forrás viselkedésének részhalmaza, nem az összes aktív magyar hirdetés teljes piacának állítása.",\n        "experimental": "KÍSÉRLETI",\n        "policy_ok": "Forrásszabály-ellenőrzés rendben",\n        "policy_paused": "Forrás szüneteltetve",\n        "postcode": "Irányítószám",\n        "all_postcodes": "Minden megfigyelt irányítószám",\n        "median_asking": "Medián kínálati ár",\n        "price_cuts": "Megfigyelt árcsökkentések",\n        "observed_reductions": "megfigyelt árcsökkentés",\n        "median_cut": "medián csökkentés",\n        "new_observations": "Új megfigyelések",\n        "last_7_days": "utolsó 7 nap",\n        "today": "ma",\n        "observed_days": "Medián megfigyelési nap",\n        "observed_days_note": "Az az idő, amióta ez a telepítés először látta a hirdetést; nem a portál eredeti hirdetési kora.",\n        "observed_history": "Megfigyelt kínálati előzmények",\n        "transaction_comparison": "Tranzakciós összevetés",\n        "asking_gap_note": "A kínálati/tranzakciós különbség eltérő sokaságokat vet össze; nem azonos a várható alku mértékével.",\n        "feature_coverage": "Strukturált tényadatok lefedettsége",\n        "listings_with_features": "Legalább 1 strukturált jellemzővel",\n        "feature_field_coverage": "Jellemzőmezők kitöltöttsége",\n        "usable_live_rows": "Használható aktív megfigyelések",\n        "feature_privacy_note": "Csak rövid tényszerű jellemzők tárolódnak; leírások, képek és elérhetőségek nem.",\n        "source_policy": "Forráshasználati korlát",\n        "removed_not_sold": "Eltűnt ≠ eladott",\n        "removed_not_sold_note": "Egy hirdetés csak ismételt sitemap-hiány után lesz inaktív. Az eltűnésből az alkalmazás soha nem következtet lezárt adásvételre.",\n        "completed_transactions": "lezárt tranzakciós adatok",\n        "local_title": "Utcaszintű adatok hamis pontosság nélkül",\n        "local_intro": "A KSH éves kerületi és utcaszintű megfigyelései, majd ezek azonos évi helyi szorzója a legfrissebb budapesti használtlakás-tranzakciós referenciára alkalmazva.",\n        "district": "Kerület",\n        "street_search": "Utcaszűrő",\n        "street_search_placeholder": "pl. Andrássy",\n        "official_local": "Közölt helyi átlag",\n        "local_factor_note": "A közölt helyi átlag osztva az azonos évi budapesti összlakás-átlaggal; ezt alkalmazzuk a legfrissebb budapesti használtlakás-referenciára.",\n        "current_local_estimate": "Aktuális helyiszorzó-becslés",\n        "street_detail": "Utcaszintű adatnapló",\n        "street": "Utca",\n        "no_street_rows": "Nincs a kiválasztásnak megfelelő közölt utcaszintű megfigyelés.",\n        "local_method_note": "Az utcasorok KSH-aggregátumok. Az aktuális értékek átlátható, szorzóalapú becslések, nem megfigyelt mai eladási árak.",\n        "local_source_note": "A KSH Ingatlanadattár éves, aggregált lezárt tranzakciós statisztikákat tartalmaz; a hiányzó cellákat az alkalmazás nem tölti ki találgatással.",\n        "precision": "Pontossági fegyelem",\n        "local_precision_note": "A kis elemszámú vagy szórtabb utcaminták alacsonyabb megbízhatósági címkét kapnak, nem azonos súllyal jelennek meg.",\n'''
          replace_once('app/i18n.py', hu_tail, hu_tail + hu_more)

          append_once(
              'app/static/app.css',
              '.intelligence-grid {',
              r'''
.intelligence-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) repeat(3, minmax(150px, .72fr));
  gap: 16px;
  margin-bottom: 18px;
}
.intelligence-signal { min-height: 205px; display: flex; flex-direction: column; justify-content: flex-end; }
.intelligence-signal .label { margin-bottom: auto; padding-right: 40px; }
.signal-number { margin: 18px 0 5px; font: 800 clamp(2.2rem, 4vw, 3.5rem)/.95 var(--mono); color: var(--ink); letter-spacing: -.06em; }
.compact-number { font-size: clamp(1.45rem, 2.8vw, 2.25rem); letter-spacing: -.045em; }
.signal-stamps { display: flex; flex-wrap: wrap; gap: 9px; justify-content: flex-end; }
.signal-stamps .source-badge { gap: 6px; align-items: center; }
.live-secondary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.data-ledger { display: grid; border-top: 1px solid var(--line); }
.data-ledger > div { display: flex; justify-content: space-between; gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.data-ledger span { color: var(--muted); font-size: .75rem; }
.data-ledger strong { font: 800 .82rem var(--mono); text-align: right; color: var(--ink); }
.street-ledger-head, .street-ledger-row { display: grid; grid-template-columns: minmax(190px, 2fr) .65fr 1fr 1fr .65fr; gap: 14px; align-items: center; }
.street-ledger-head { padding: 8px 12px; background: var(--ink); color: var(--paper-2); font: 800 .63rem var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.street-ledger-row { padding: 11px 12px; border-bottom: 1px solid var(--line); }
.street-ledger-row:hover { background: var(--paper-2); }
.street-primary { min-width: 0; display: grid; gap: 2px; }
.street-primary strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--serif); color: var(--ink); }
.street-primary small { color: var(--muted); font: 650 .68rem var(--mono); }
.street-count, .street-value { font: 760 .78rem var(--mono); font-variant-numeric: tabular-nums; }
.street-value.current { color: var(--asking); font-weight: 850; }
.confidence-chip { justify-self: start; padding: 4px 6px; border: 1px solid var(--line-dark); font: 800 .58rem var(--mono); letter-spacing: .06em; }
.confidence-chip.high { color: var(--good); }
.confidence-chip.medium { color: var(--warn); }
.confidence-chip.low { color: var(--bad); }
.street-ledger-card { margin-bottom: 18px; }
.current-local-card { border-top: 3px solid var(--asking); }

@media (max-width: 920px) {
  .intelligence-grid { grid-template-columns: 1fr 1fr; }
  .intelligence-lead { grid-column: 1 / -1; }
  .live-secondary-grid { grid-template-columns: 1fr; }
  .live-filter, .local-filter { grid-template-columns: 1fr 1fr; }
  .live-filter button, .local-filter button { grid-column: 1 / -1; }
  .street-ledger-head { display: none; }
  .street-ledger-row { grid-template-columns: minmax(0, 1.7fr) .55fr 1fr; }
  .street-ledger-row .street-value:first-of-type { display: none; }
  .street-ledger-row .confidence-chip { display: none; }
}

@media (max-width: 600px) {
  .intelligence-grid { grid-template-columns: 1fr; }
  .intelligence-lead { grid-column: auto; }
  .live-filter, .local-filter { grid-template-columns: 1fr; }
  .live-filter button, .local-filter button { grid-column: auto; }
  .signal-stamps { justify-content: flex-start; }
  .street-ledger-row { grid-template-columns: minmax(0, 1fr) auto; gap: 9px; }
  .street-ledger-row .street-count { display: none; }
  .street-ledger-row .street-value.current { text-align: right; }
}
