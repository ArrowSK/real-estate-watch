name: One-time live market reconciliation

on:
  push:
    paths:
      - '.github/workflows/one-time-reconcile-live-market.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/live-market-intelligence
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fast-forward target branch
        run: git pull --ff-only origin reconcile/live-market-intelligence
      - name: Apply reconciler
        run: python scripts/run_reconcile_live_intelligence.py
      - name: Commit and push target branch
        run: |
          git config user.name 'Real Estate Watch maintenance'
          git config user.email '56678503+ArrowSK@users.noreply.github.com'
          git add app/services/duna_house.py app/main.py app/templates/base.html app/i18n.py app/static/app.css
          git diff --cached --check
          git commit -m 'Reconcile live-market branch with current analytics'
          git push origin HEAD:reconcile/live-market-intelligence
