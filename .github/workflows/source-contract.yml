name: Source contract check

on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
  push:
    paths:
      - '.github/workflows/source-contract.yml'
      - 'app/services/duna_house.py'
      - 'app/services/ksh_local.py'
      - 'app/services/market.py'
      - 'app/services/fx.py'
      - 'app/config.py'

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e .
      - name: Prepare local reference database
        run: python -m app.cli seed

      - name: Inspect official KSH granular JSON schema
        id: ksh_schema
        continue-on-error: true
        run: |
          python - <<'PY'
          import collections
          import httpx
          import json
          import re

          headers = {
              'User-Agent': 'real-estate-watch/0.2',
              'Accept': 'application/json',
          }
          url = 'https://www.ksh.hu/s/ingatlanadattar/inga-data.json'
          data = httpx.get(url, headers=headers, follow_redirects=True, timeout=60).json()
          print('rows=', len(data))
          keys = sorted({key for row in data for key in row})
          print('keys=', keys)
          print('levels=', collections.Counter(row.get('szint') for row in data))
          print('years=', min(row['ev'] for row in data), max(row['ev'] for row in data))
          budapest = [row for row in data if str(row.get('megye')) == '01']
          print('budapest_rows=', len(budapest))
          print('budapest_levels=', collections.Counter(row.get('szint') for row in budapest))
          for level in sorted({row.get('szint') for row in budapest}, key=str):
              sample = [row for row in budapest if row.get('szint') == level][:3]
              print('LEVEL_SAMPLE', level, json.dumps(sample, ensure_ascii=False))
          for name in ('Andrássy út', 'Agyagfejtő utca', 'Ady Endre út'):
              sample = [row for row in budapest if str(row.get('kozter') or '').casefold() == name.casefold()][:5]
              print('STREET_SAMPLE', name, json.dumps(sample, ensure_ascii=False))
          for ter in ('10700', '04011'):
              sample = [row for row in budapest if str(row.get('telaz')) == ter][:5]
              print('TER_SAMPLE', ter, json.dumps(sample, ensure_ascii=False))

          js = httpx.get(
              'https://www.ksh.hu/s/ingatlanadattar/assets/teleplist.js',
              headers={'User-Agent': 'real-estate-watch/0.2'},
              follow_redirects=True,
              timeout=30,
          ).text
          for needle in ('Budapest 06. kerület', 'Budapest 10. kerület', 'Budapest 19. kerület'):
              pos = js.find(needle)
              print('TELEP_CONTEXT', needle, js[max(0, pos-220):pos+280] if pos >= 0 else 'NOT_FOUND')
          # Keep output compact: list only object-looking fragments containing Budapest district labels.
          fragments = re.findall(r'\{[^{}]{0,400}Budapest\s+\d{2}\.\s*kerület[^{}]{0,400}\}', js)
          print('DISTRICT_FRAGMENTS', fragments[:25])
          PY

      - name: Check Duna House robots contract independently
        id: dh_shape
        continue-on-error: true
        run: |
          python - <<'PY'
          import httpx
          from urllib import robotparser
          from app.config import get_settings
          from app.services.duna_house import DH_USER_AGENT

          s = get_settings()
          r = httpx.get(s.dh_robots_url, follow_redirects=True, timeout=30, headers={'User-Agent': DH_USER_AGENT})
          p = robotparser.RobotFileParser()
          p.parse(r.text.splitlines())
          print('status=', r.status_code)
          print('can_fetch=', p.can_fetch(DH_USER_AGENT, 'https://dh.hu/elado-ingatlan/lakas-haz'))
          print('sitemaps=', p.site_maps())
          print('configured=', s.dh_sitemap_url)
          PY

      - name: Check live KSH price contract
        id: ksh_prices
        continue-on-error: true
        run: python -m app.cli collect-market
      - name: Check live KSH transaction-count contract
        id: ksh_counts
        continue-on-error: true
        run: python -m app.cli collect-counts
      - name: Check granular KSH contract
        id: ksh_local
        continue-on-error: true
        run: python -m app.cli collect-local
      - name: Check live MNB exchange-rate contract
        id: mnb_fx
        continue-on-error: true
        run: python -m app.cli collect-fx
      - name: Check guarded Duna House contract
        id: duna_house
        continue-on-error: true
        run: python -m app.cli probe-dh
      - name: Run resulting self-checks
        id: self_check
        continue-on-error: true
        run: python -m app.cli self-check

      - name: Enforce source-contract results
        if: always()
        env:
          KSH_SCHEMA: ${{ steps.ksh_schema.outcome }}
          DH_SHAPE: ${{ steps.dh_shape.outcome }}
          KSH_PRICES: ${{ steps.ksh_prices.outcome }}
          KSH_COUNTS: ${{ steps.ksh_counts.outcome }}
          KSH_LOCAL: ${{ steps.ksh_local.outcome }}
          MNB_FX: ${{ steps.mnb_fx.outcome }}
          DUNA_HOUSE: ${{ steps.duna_house.outcome }}
          SELF_CHECK: ${{ steps.self_check.outcome }}
        run: |
          printf '%-24s %s\n' \
            'KSH JSON schema' "$KSH_SCHEMA" \
            'Duna robots diagnostic' "$DH_SHAPE" \
            'KSH quarterly prices' "$KSH_PRICES" \
            'KSH transaction counts' "$KSH_COUNTS" \
            'KSH granular' "$KSH_LOCAL" \
            'MNB FX' "$MNB_FX" \
            'Duna House probe' "$DUNA_HOUSE" \
            'Application self-check' "$SELF_CHECK"
          test "$KSH_SCHEMA" = success
          test "$DH_SHAPE" = success
          test "$KSH_PRICES" = success
          test "$KSH_COUNTS" = success
          test "$KSH_LOCAL" = success
          test "$MNB_FX" = success
          test "$DUNA_HOUSE" = success
          test "$SELF_CHECK" = success
