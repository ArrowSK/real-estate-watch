name: Source contract check

on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
  push:
    paths:
      - '.github/workflows/source-contract.yml'
      - 'app/services/duna_house.py'
      - 'app/services/ksh_local.py'
      - 'app/services/market.py'
      - 'app/services/fx.py'
      - 'app/config.py'

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e .
      - name: Prepare local reference database
        run: python -m app.cli seed

      # Keep diagnostics ahead of source collectors so an unrelated transient source timeout
      # cannot hide the information needed to repair another provider contract.
      - name: Diagnose granular KSH client data contract
        id: ksh_local_shape
        continue-on-error: true
        run: |
          python - <<'PY'
          import re
          import httpx
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          url = 'https://www.ksh.hu/s/ingatlanadattar/adattar?ter=01&year=2024'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept-Language': 'hu-HU,hu;q=0.9,en;q=0.5',
          }
          with httpx.Client(headers=headers, follow_redirects=True, timeout=30) as client:
              response = client.get(url)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, 'html.parser')
              tables = soup.find_all('table')
              scripts = [urljoin(str(response.url), x.get('src')) for x in soup.find_all('script') if x.get('src')]
              inline = '\n'.join(x.string or '' for x in soup.find_all('script') if not x.get('src'))
              inline_hints = sorted(set(re.findall(r"[\"']([^\"']*(?:api|ajax|json|csv|xlsx|export|download)[^\"']*)[\"']", inline, re.I)))[:40]
              print('status=', response.status_code, 'url=', response.url, 'bytes=', len(response.text), 'tables=', len(tables))
              print('title=', soup.title.get_text(' ', strip=True) if soup.title else None)
              print('scripts=', scripts[-30:])
              print('inline_hints=', inline_hints)
              print('table_row_cell_counts=', [[len(r.find_all(['th','td'])) for r in t.find_all('tr')[:12]] for t in tables[:8]])
              print('data_markers=', 'Budapest 06. kerület' in response.text, '1&nbsp;132' in response.text, '1132' in response.text)

              for script_url in scripts:
                  if not any(name in script_url for name in ('base', 'teleplist', 'inga-table', 'inga-chart')):
                      continue
                  js = client.get(script_url)
                  print('JS', script_url, 'status=', js.status_code, 'bytes=', len(js.text))
                  hints = sorted(set(re.findall(r"[\"']([^\"']*(?:inga-data|\.json|api|ajax|csv|xlsx|export|download)[^\"']*)[\"']", js.text, re.I)))
                  print('JS_HINTS', script_url.rsplit('/', 1)[-1], hints[:80])
                  for needle in ('inga-data', 'fetch(', '$.get', '$.ajax', 'XMLHttpRequest'):
                      pos = js.text.find(needle)
                      if pos >= 0:
                          print('JS_CONTEXT', needle, js.text[max(0, pos - 300):pos + 700])

              # The inline page script currently names this file. Probe likely locations only;
              # no returned data are persisted by this diagnostic step.
              for candidate in (
                  urljoin(str(response.url), 'inga-data.json'),
                  urljoin(str(response.url), './inga-data.json'),
                  'https://www.ksh.hu/s/ingatlanadattar/assets/inga-data.json',
              ):
                  probe = client.get(candidate)
                  print('DATA_PROBE', candidate, probe.status_code, probe.headers.get('content-type'), len(probe.content), probe.text[:180].replace('\n',' '))
          PY

      - name: Diagnose Duna House robots contract
        id: dh_shape
        continue-on-error: true
        run: |
          python - <<'PY'
          import httpx
          from urllib import robotparser
          from app.config import get_settings
          from app.services.duna_house import DH_USER_AGENT

          s = get_settings()
          r = httpx.get(s.dh_robots_url, follow_redirects=True, timeout=30, headers={'User-Agent': DH_USER_AGENT})
          print('status=', r.status_code, 'content_type=', r.headers.get('content-type'), 'bytes=', len(r.content))
          print('repr=', repr(r.text[:1000]))
          p = robotparser.RobotFileParser()
          p.parse(r.text.splitlines())
          print('can_fetch_custom=', p.can_fetch(DH_USER_AGENT, 'https://dh.hu/elado-ingatlan/lakas-haz'))
          print('can_fetch_star=', p.can_fetch('*', 'https://dh.hu/elado-ingatlan/lakas-haz'))
          print('sitemaps=', p.site_maps())
          print('configured=', s.dh_sitemap_url)
          PY

      - name: Check live KSH price contract
        id: ksh_prices
        continue-on-error: true
        run: python -m app.cli collect-market
      - name: Check live KSH transaction-count contract
        id: ksh_counts
        continue-on-error: true
        run: python -m app.cli collect-counts
      - name: Check granular KSH district and street contract
        id: ksh_local
        continue-on-error: true
        run: python -m app.cli collect-local
      - name: Check live MNB exchange-rate contract
        id: mnb_fx
        continue-on-error: true
        run: python -m app.cli collect-fx
      # This is deliberately a probe: policy + sitemap + one listing page. CI never performs
      # a bulk Duna House listing collection.
      - name: Check guarded Duna House discovery and factual-page contract
        id: duna_house
        continue-on-error: true
        run: python -m app.cli probe-dh
      - name: Run resulting self-checks
        id: self_check
        continue-on-error: true
        run: python -m app.cli self-check

      - name: Enforce source-contract results
        if: always()
        env:
          KSH_LOCAL_SHAPE: ${{ steps.ksh_local_shape.outcome }}
          DH_SHAPE: ${{ steps.dh_shape.outcome }}
          KSH_PRICES: ${{ steps.ksh_prices.outcome }}
          KSH_COUNTS: ${{ steps.ksh_counts.outcome }}
          KSH_LOCAL: ${{ steps.ksh_local.outcome }}
          MNB_FX: ${{ steps.mnb_fx.outcome }}
          DUNA_HOUSE: ${{ steps.duna_house.outcome }}
          SELF_CHECK: ${{ steps.self_check.outcome }}
        run: |
          printf '%-24s %s\n' \
            'KSH client diagnostic' "$KSH_LOCAL_SHAPE" \
            'Duna robots diagnostic' "$DH_SHAPE" \
            'KSH quarterly prices' "$KSH_PRICES" \
            'KSH transaction counts' "$KSH_COUNTS" \
            'KSH granular' "$KSH_LOCAL" \
            'MNB FX' "$MNB_FX" \
            'Duna House probe' "$DUNA_HOUSE" \
            'Application self-check' "$SELF_CHECK"
          test "$KSH_LOCAL_SHAPE" = success
          test "$DH_SHAPE" = success
          test "$KSH_PRICES" = success
          test "$KSH_COUNTS" = success
          test "$KSH_LOCAL" = success
          test "$MNB_FX" = success
          test "$DUNA_HOUSE" = success
          test "$SELF_CHECK" = success
