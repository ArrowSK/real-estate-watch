name: Source contract check

on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
  push:
    paths:
      - '.github/workflows/source-contract.yml'
      - 'app/services/duna_house.py'
      - 'app/services/live_intelligence.py'
      - 'app/services/health.py'
      - 'app/services/ksh_local.py'
      - 'app/services/market.py'
      - 'app/services/transaction_counts.py'
      - 'app/services/fx.py'
      - 'app/config.py'
      - 'app/models.py'
      - 'tests/test_duna_house.py'
      - 'tests/test_ksh_local.py'
      - 'tests/test_live_intelligence.py'

permissions:
  contents: read

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e .
      - name: Prepare local reference database
        run: python -m app.cli seed

      # Each external contract is allowed to finish independently. The final step then fails
      # the workflow if any required source broke, so one outage cannot hide another parser
      # or policy failure in the same run.
      - name: Check live KSH quarterly-price contract
        id: ksh_prices
        continue-on-error: true
        run: python -m app.cli collect-market
      - name: Check live KSH transaction-count contract
        id: ksh_counts
        continue-on-error: true
        run: python -m app.cli collect-counts
      - name: Check live KSH granular market contract
        id: ksh_local
        continue-on-error: true
        run: python -m app.cli collect-local
      - name: Check live MNB exchange-rate contract
        id: mnb_fx
        continue-on-error: true
        run: python -m app.cli collect-fx
      # The Duna House check is deliberately a bounded residential probe. CI does not run
      # the production listing collection merely to test an upstream contract.
      - name: Check guarded Duna House residential contract
        id: duna_house
        continue-on-error: true
        run: python -m app.cli probe-dh
      - name: Run resulting application self-checks
        id: self_check
        continue-on-error: true
        run: python -m app.cli self-check

      - name: Enforce source-contract results
        if: always()
        env:
          KSH_PRICES: ${{ steps.ksh_prices.outcome }}
          KSH_COUNTS: ${{ steps.ksh_counts.outcome }}
          KSH_LOCAL: ${{ steps.ksh_local.outcome }}
          MNB_FX: ${{ steps.mnb_fx.outcome }}
          DUNA_HOUSE: ${{ steps.duna_house.outcome }}
          SELF_CHECK: ${{ steps.self_check.outcome }}
        run: |
          printf '%-26s %s\n' \
            'KSH quarterly prices' "$KSH_PRICES" \
            'KSH transaction counts' "$KSH_COUNTS" \
            'KSH granular market' "$KSH_LOCAL" \
            'MNB FX' "$MNB_FX" \
            'Duna House residential' "$DUNA_HOUSE" \
            'Application self-check' "$SELF_CHECK"
          test "$KSH_PRICES" = success
          test "$KSH_COUNTS" = success
          test "$KSH_LOCAL" = success
          test "$MNB_FX" = success
          test "$DUNA_HOUSE" = success
          test "$SELF_CHECK" = success
