<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#172521">
  <title>{% block title %}{{ t.app_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='mark.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/" aria-label="{{ t.app_name }}">
        <img class="brand-mark" src="{{ url_for('static', path='mark.svg') }}" alt="" width="44" height="44">
        <span class="brand-copy">
          <strong>{{ t.app_name }}</strong>
          <small>{{ t.tagline }}</small>
        </span>
      </a>
      <div class="header-actions">
        <span class="country-stamp">HU <i>·</i> HUF</span>
        <a class="language" href="/language/{{ 'hu' if lang == 'en' else 'en' }}?next={{ request.url.path }}">{{ t.language }}</a>
      </div>
    </div>
  </header>

  <nav class="top-nav" aria-label="Primary">
    <div class="wrap nav-row">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#market"></use></svg>
        <span>{{ t.market }}</span>
      </a>
      <a href="/valuation" class="{% if request.url.path == '/valuation' %}active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#valuation"></use></svg>
        <span>{{ t.valuation }}</span>
      </a>
      <a href="/mortgage" class="{% if request.url.path == '/mortgage' %}active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#mortgage"></use></svg>
        <span>{{ t.mortgage }}</span>
      </a>
      <a href="/diagnostics" class="{% if request.url.path == '/diagnostics' %}active{% endif %}">
        <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#diagnostics"></use></svg>
        <span>{{ t.diagnostics }}</span>
      </a>
    </div>
  </nav>

  <main class="wrap main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span class="footer-mark"><img src="{{ url_for('static', path='mark.svg') }}" alt="" width="24" height="24"> Real Estate Watch v{{ version }}</span>
      <span>{{ t.footer_country }}</span>
    </div>
  </footer>
</body>
</html>
