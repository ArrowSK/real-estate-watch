{% macro icon(name, size=20) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  {% if name == 'market' %}
    <path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/>
    <path class="accent-stroke" d="M3 15.5 8.5 11l5 2.5L21 7"/>
  {% elif name == 'live' %}
    <path d="M3 12h4l2.2-5.2 4.1 10.4L16 12h5"/>
    <circle class="accent-fill" cx="9.2" cy="6.8" r="1.3"/>
  {% elif name == 'local' %}
    <path d="M4 4h16v16H4zM9 4v16M15 4v16M4 10h16M4 15h16"/>
    <circle class="accent-fill" cx="15" cy="10" r="2.4"/>
  {% elif name == 'valuation' %}
    <path d="m5 18 13-13 2 2L7 20H5z"/>
    <path d="m10 13 2 2m1-5 2 2m1-5 2 2"/>
  {% elif name == 'mortgage' %}
    <path d="M3 11.5 12 4l9 7.5M6 10v10h12V10"/>
    <path class="accent-stroke" d="M10 15h4m-2-2v4"/>
  {% elif name == 'diagnostics' %}
    <path d="M3 12h4l2-5 4 10 2-5h6"/>
    <path d="M5 4h14M5 20h14"/>
  {% elif name == 'source' %}
    <ellipse cx="12" cy="6" rx="7" ry="3"/>
    <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
  {% elif name == 'sample' %}
    <circle cx="7" cy="8" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="12" cy="16" r="2"/>
    <path d="M8.5 9.5 10.8 14M15.5 9.5 13.2 14M9 8h6"/>
  {% elif name == 'trend' %}
    <path d="M4 18V6M4 18h16"/>
    <path class="accent-stroke" d="m6 15 4-5 4 2 5-7"/>
  {% elif name == 'shield' %}
    <path d="M12 3 19 6v5c0 4.7-2.9 8-7 10-4.1-2-7-5.3-7-10V6z"/>
    <path class="accent-stroke" d="m8.5 12 2.2 2.2 4.8-5"/>
  {% elif name == 'building' %}
    <path d="M5 21V5l7-2v18M12 8h7v13M8 8h1m-1 4h1m-1 4h1m7-5h1m-1 4h1"/>
  {% elif name == 'pin' %}
    <path d="M12 21s6-6.1 6-11a6 6 0 1 0-12 0c0 4.9 6 11 6 11z"/>
    <circle class="accent-fill" cx="12" cy="10" r="2"/>
  {% elif name == 'arrow' %}
    <path d="M5 12h14m-5-5 5 5-5 5"/>
  {% else %}
    <circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>
  {% endif %}
</svg>
{%- endmacro %}
